[project]
name = "summarizer"
version = "0.1.0"
description = "FastAPI-сервис для анализа и суммаризации тендерной документации в формате PDF с использованием LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "pillow>=10.0",
    "openai>=1.40",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI использует File/Form как аргументы-зависимости.
"app/main.py" = ["B008"]
